<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#nightGrad)"/>
  <!-- Estrellas -->
  <circle cx="100" cy="80" r="2" fill="white"/>
  <circle cx="200" cy="120" r="1.5" fill="white"/>
  <circle cx="350" cy="60" r="2" fill="white"/>
  <circle cx="500" cy="100" r="1.5" fill="white"/>
  <circle cx="650" cy="70" r="2" fill="white"/>
  <circle cx="720" cy="140" r="1.5" fill="white"/>
  <circle cx="150" cy="180" r="1" fill="white"/>
  <circle cx="450" cy="150" r="1" fill="white"/>
  <!-- Luna -->
  <circle cx="680" cy="100" r="40" fill="#F5F5DC"/>
  <circle cx="695" cy="95" r="35" fill="url(#nightGrad)"/>
  <!-- Suelo -->
  <rect x="0" y="420" width="800" height="180" fill="#2D5A27"/>
  <!-- Carpa 1 -->
  <polygon points="200,420 300,300 400,420" fill="#E8A838"/>
  <polygon points="250,420 300,340 350,420" fill="#5D3A1A"/>
  <!-- Carpa 2 -->
  <polygon points="480,420 560,320 640,420" fill="#4A7C43"/>
  <polygon points="520,420 560,360 600,420" fill="#1E3D1A"/>
  <!-- Fogata -->
  <ellipse cx="400" cy="480" rx="40" ry="15" fill="#5D3A1A"/>
  <polygon points="380,480 400,420 420,480" fill="#FF6B35"/>
  <polygon points="390,480 400,440 410,480" fill="#F7931E"/>
  <!-- Chispas -->
  <circle cx="395" cy="400" r="3" fill="#FF6B35"/>
  <circle cx="408" cy="390" r="2" fill="#F7931E"/>
  <circle cx="385" cy="385" r="2" fill="#FF6B35"/>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.9">Zona de Camping</text>
</svg>
