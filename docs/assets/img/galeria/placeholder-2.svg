<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#8B5A2B"/>
  <!-- Cabaña estilizada -->
  <rect x="200" y="280" width="400" height="220" fill="#5D3A1A"/>
  <!-- Techo -->
  <polygon points="150,280 400,120 650,280" fill="#3D2814"/>
  <!-- Puerta -->
  <rect x="350" y="380" width="100" height="120" fill="#2C1810"/>
  <!-- Ventanas -->
  <rect x="240" y="340" width="80" height="60" fill="#87CEEB" opacity="0.6"/>
  <rect x="480" y="340" width="80" height="60" fill="#87CEEB" opacity="0.6"/>
  <!-- Suelo -->
  <rect x="0" y="500" width="800" height="100" fill="#4A7C43"/>
  <!-- Cielo -->
  <rect x="0" y="0" width="800" height="280" fill="#E8D5B7"/>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.9">Cabaña Rústica</text>
</svg>
