<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | La Arenilla</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
        :root {
            --color-primary: #2D5A27;
            --color-primary-light: #4A7C43;
            --color-text: #2C2C2C;
            --color-text-light: #5A5A5A;
            --color-bg: #FAFAF8;
            --color-white: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        
        .error-container {
            max-width: 500px;
        }
        
        .error-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: var(--color-primary);
            line-height: 1;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-family: Georgia, serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--color-text);
        }
        
        .error-description {
            color: var(--color-text-light);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        
        @media (min-width: 480px) {
            .error-actions {
                flex-direction: row;
                justify-content: center;
            }
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        
        .btn--primary {
            background-color: var(--color-primary);
            color: var(--color-white);
        }
        
        .btn--primary:hover {
            background-color: var(--color-primary-light);
            transform: translateY(-2px);
        }
        
        .btn--secondary {
            background-color: var(--color-white);
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }
        
        .btn--secondary:hover {
            background-color: var(--color-primary);
            color: var(--color-white);
        }
        
        .footer-text {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: var(--color-text-light);
        }
        
        .footer-text a {
            color: var(--color-primary);
            text-decoration: none;
        }
        
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <!-- Ícono de montaña con signo de interrogación -->
        <svg class="error-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="58" stroke="#2D5A27" stroke-width="4" fill="#F0EDE8"/>
            <path d="M25 85 L60 40 L95 85 Z" fill="#4A7C43"/>
            <path d="M40 85 L60 55 L80 85 Z" fill="#2D5A27"/>
            <circle cx="80" cy="45" r="10" fill="#E8A838"/>
            <text x="60" y="78" text-anchor="middle" font-size="28" font-weight="bold" fill="white">?</text>
        </svg>
        
        <div class="error-code">404</div>
        
        <h1 class="error-title">¡Ups! Página no encontrada</h1>
        
        <p class="error-description">
            Parece que te perdiste en el sendero. La página que buscas no existe 
            o fue movida a otro lugar.
        </p>
        
        <div class="error-actions">
            <a href="/" class="btn btn--primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Volver al Inicio
            </a>
            <a href="https://wa.me/50700000000?text=Hola,%20necesito%20ayuda%20para%20encontrar%20información" 
               class="btn btn--secondary" 
               target="_blank" 
               rel="noopener noreferrer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                Contáctanos
            </a>
        </div>
        
        <p class="footer-text">
            <a href="/">La Arenilla</a> · Turismo Rural Comunitario
        </p>
    </div>
</body>
</html>
