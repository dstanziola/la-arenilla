<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#4A7C43"/>
  <!-- Cielo -->
  <rect x="0" y="0" width="800" height="300" fill="#87CEEB"/>
  <!-- Montaña fondo -->
  <path d="M0 300 L200 150 L400 250 L600 120 L800 200 L800 350 L0 350 Z" fill="#2D5A27" opacity="0.5"/>
  <!-- Grupo de personas estilizadas -->
  <!-- Persona 1 -->
  <circle cx="250" cy="380" r="35" fill="#E8D5B7"/>
  <rect x="220" y="420" width="60" height="100" rx="10" fill="#2D5A27"/>
  <!-- Persona 2 -->
  <circle cx="350" cy="360" r="40" fill="#E8D5B7"/>
  <rect x="315" y="405" width="70" height="115" rx="10" fill="#8B5A2B"/>
  <!-- Persona 3 -->
  <circle cx="450" cy="370" r="38" fill="#E8D5B7"/>
  <rect x="417" y="413" width="66" height="107" rx="10" fill="#E8A838"/>
  <!-- Persona 4 -->
  <circle cx="550" cy="380" r="35" fill="#E8D5B7"/>
  <rect x="520" y="420" width="60" height="100" rx="10" fill="#4A7C43"/>
  <!-- Brazos levantados (celebración) -->
  <line x1="250" y1="450" x2="220" y2="400" stroke="#E8D5B7" stroke-width="12" stroke-linecap="round"/>
  <line x1="250" y1="450" x2="280" y2="400" stroke="#E8D5B7" stroke-width="12" stroke-linecap="round"/>
  <line x1="550" y1="450" x2="520" y2="400" stroke="#E8D5B7" stroke-width="12" stroke-linecap="round"/>
  <line x1="550" y1="450" x2="580" y2="400" stroke="#E8D5B7" stroke-width="12" stroke-linecap="round"/>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.9">Nuestra Comunidad</text>
</svg>
